const buttons=[...document.querySelectorAll('.genre')],tray=document.getElementById('tray'),hint=document.getElementById('hint'),result=document.getElementById('result');let last={},timer,currentUrl='',audio,master,loopId,soundOn=false,userMuted=false;function music(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.24;master.connect(audio.destination)}audio.resume();if(loopId)return;let beat=0;const notes=[196,246.94,293.66,220,261.63,329.63,174.61,220,261.63,196,246.94,293.66];function tone(freq,start,duration,type,vol){const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(vol,start+.015);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);osc.connect(gain);gain.connect(master);osc.start(start);osc.stop(start+duration+.02)}function tick(){if(!soundOn)return;const t=audio.currentTime+.03;let n=beat%12;tone(notes[n]/2,t,.27,'sine',.36);if(n%3===0){tone(notes[n],t,.6,'triangle',.15);tone(notes[n]*1.26,t,.6,'triangle',.08)}if(n%2===1)tone(1600,t,.035,'triangle',.018);beat++}tick();loopId=setInterval(tick,330)}function stopMusic(){if(loopId){clearInterval(loopId);loopId=null}if(audio)audio.suspend()}document.getElementById('sound').onclick=()=>{soundOn=!soundOn;userMuted=!soundOn;const el=document.getElementById('sound');el.textContent=soundOn?'♪ SOUND ON':'♪ SOUND OFF';el.setAttribute('aria-pressed',String(soundOn));soundOn?music():stopMusic()};buttons.forEach(btn=>btn.addEventListener('click',()=>{const genre=btn.dataset.genre,list=songs[genre]||[];if(!list.length){clearTimeout(timer);currentUrl='';result.classList.remove('visible');tray.classList.remove('dispensing');hint.hidden=false;hint.textContent=genre+' · 아직 등록된 곡이 없어요.';buttons.forEach(b=>b.disabled=false);return}if(!soundOn&&!userMuted){soundOn=true;document.getElementById('sound').textContent='♪ SOUND ON';document.getElementById('sound').setAttribute('aria-pressed','true')}if(soundOn)music();let choices=list.map((_,i)=>i).filter(i=>i!==last[genre]);if(!choices.length)choices=list.map((_,i)=>i);const index=choices[Math.floor(Math.random()*choices.length)];last[genre]=index;clearTimeout(timer);buttons.forEach(b=>b.disabled=true);result.classList.remove('visible');hint.hidden=false;hint.innerHTML='CD를 꺼내는 중...';tray.classList.remove('dispensing');void tray.offsetWidth;timer=setTimeout(()=>{const [title,artist,url]=list[index];currentUrl=url;document.getElementById('tag').textContent=genre+' · YOUR PICK';document.getElementById('title').textContent=title;document.getElementById('artist').textContent=artist;document.getElementById('youtube').href=url;hint.hidden=true;result.classList.add('visible');tray.classList.add('dispensing');buttons.forEach(b=>b.disabled=false)},650)}));document.getElementById('youtube').addEventListener('click',()=>{soundOn=false;document.getElementById('sound').textContent='♪ SOUND OFF';document.getElementById('sound').setAttribute('aria-pressed','false');stopMusic()});document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(currentUrl);const el=document.getElementById('copy');el.textContent='복사 완료';setTimeout(()=>el.textContent='링크 복사',1800)}catch{window.prompt('링크를 복사해 주세요',currentUrl)}};
</script></body></html>
