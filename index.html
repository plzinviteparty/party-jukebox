<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171c3a"><title>PARTY JUKEBOX</title><meta name="description" content="장르를 누르고 오늘의 음악을 뽑아 보세요."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23171c3a'/%3E%3Ccircle cx='16' cy='16' r='12' fill='%23fb6ba4'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff0a8'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23171c3a'/%3E%3C/svg%3E"><style>@import url('https://cdn.jsdelivr.net/gh/quiple/galmuri@main/dist/galmuri.css');:root{font-family:Galmuri11,'Courier New',monospace;color:#fdf0d2;background:#10162f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#404169 0,transparent 55%),repeating-linear-gradient(90deg,#10162f 0 44px,#121933 44px 46px);padding:24px 14px 42px}.wrap{max-width:680px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.top h1{font-size:clamp(18px,4vw,26px);letter-spacing:.12em;margin:0;text-shadow:3px 3px #913d77}.sound{border:2px solid #ffc2d9;background:#252b55;color:#fff4dc;padding:10px 12px;font:inherit;font-size:13px;cursor:pointer;box-shadow:3px 3px 0 #090e27}.machine{border:6px solid #fb79ad;border-radius:14px;background:#b44687;box-shadow:0 0 0 5px #573565,9px 12px 0 #080e25,0 28px 50px #05091d;overflow:hidden;padding:14px}.marquee{text-align:center;background:#2c2856;border:4px solid #ffe4aa;padding:12px 5px;color:#ffe6a3;letter-spacing:.15em;font-size:clamp(17px,4vw,26px);text-shadow:2px 2px #bb5893;box-shadow:inset 0 0 0 3px #533963}.inside{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:13px;margin-top:14px}.window{height:345px;border:5px solid #fff1c7;background:repeating-linear-gradient(0deg,#22264d,#22264d 32px,#292d57 32px,#292d57 36px);box-shadow:inset 0 0 0 5px #151a39;position:relative;display:grid;place-items:center;overflow:hidden}.glow{position:absolute;inset:0;background:linear-gradient(120deg,#ffffff12 0 20%,transparent 20% 70%,#ffffff08 70%);pointer-events:none}.records{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px}.record{aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#212542 0 3px,#404475 4px 5px);border:4px solid #f9a8cc;display:grid;place-items:center;box-shadow:5px 5px #121634}.record:after{content:'';width:35%;aspect-ratio:1;background:#ffe2a0;border-radius:50%;border:5px solid #dc619d}.side{background:#5b397b;border:3px solid #eac0d7;padding:10px;display:flex;flex-direction:column;gap:8px}.side label{font-size:12px;color:#ffe9b7;text-align:center;margin-bottom:2px}.genre{border:3px solid #fff1c8;background:#ffe3a0;color:#2b244b;box-shadow:3px 4px #282042;font:inherit;font-size:13px;font-weight:bold;padding:10px 4px;cursor:pointer;min-height:42px}.genre:hover,.genre:focus-visible{background:#fff7d6;transform:translateY(-2px)}.genre:disabled{opacity:.55;cursor:wait}.tray{margin-top:13px;border:5px solid #402754;border-bottom-width:9px;border-radius:7px;background:#211b3f;min-height:112px;display:flex;align-items:center;justify-content:center;padding:13px;position:relative;overflow:hidden}.hint{text-align:center;color:#fbd3e4;line-height:1.6;font-size:14px}.disc{width:92px;height:92px;border-radius:50%;background:repeating-radial-gradient(circle,#d1bbff 0 5px,#8b8cda 6px 9px,#413b83 10px 13px);border:5px solid #edb0d7;display:grid;place-items:center;box-shadow:5px 5px #0c0d29;flex:none}.disc:after{content:'';width:27px;height:27px;background:#ffe6a3;border-radius:50%;border:6px solid #b94e93}.tray.dispensing .disc{animation:drop 1.3s cubic-bezier(.25,.65,.25,1) both}@keyframes drop{0%{transform:translateY(-150px) rotate(-150deg);opacity:0}65%{transform:translateY(8px) rotate(25deg);opacity:1}100%{transform:translateY(0) rotate(0)}}.result{display:none;gap:14px;align-items:center;width:100%}.result.visible{display:flex}.song{min-width:0;flex:1}.tag{font-size:12px;color:#ffba75}.song strong{display:block;font-size:clamp(16px,3.6vw,20px);line-height:1.45;overflow-wrap:anywhere}.song span{display:block;font-size:14px;margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions a,.actions button{font:inherit;font-size:12px;background:#ffe2a0;border:2px solid #fff4d3;color:#252040;padding:8px;text-decoration:none;cursor:pointer}.actions button{background:#f6a6cb}.status{margin:19px 3px 0;text-align:center;font-size:13px;color:#e4c8dc;line-height:1.6}@media(max-width:540px){body{padding:18px 11px 36px}.machine{padding:10px}.inside{grid-template-columns:1fr}.window{height:205px}.records{max-width:280px}.side{display:grid;grid-template-columns:repeat(3,1fr)}.side label{grid-column:1/-1}.genre{font-size:12px;padding:8px 2px}.tray{min-height:130px}.disc{width:70px;height:70px}.result{gap:9px}}</style></head><body><main class="wrap"><header class="top"><h1>PARTY JUKEBOX</h1><button class="sound" id="sound" aria-pressed="false">♪ SOUND OFF</button></header><section class="machine" aria-label="음악 추천 자판기"><div class="marquee">★ MUSIC VENDING ★</div><div class="inside"><div class="window" aria-hidden="true"><div class="records"><i class="record"></i><i class="record"></i><i class="record"></i><i class="record"></i><i class="record"></i><i class="record"></i></div><div class="glow"></div></div><div class="side"><label>CHOOSE A GENRE</label><button class="genre" data-genre="KPOP">KPOP</button><button class="genre" data-genre="JPOP">JPOP</button><button class="genre" data-genre="INDIE">INDIE</button><button class="genre" data-genre="HIPHOP">HIPHOP</button><button class="genre" data-genre="ROCK">ROCK</button></div></div><div class="tray" id="tray" aria-live="polite"><div class="hint" id="hint">장르 버튼을 누르면<br>오늘의 CD가 나옵니다.</div><div class="result" id="result"><div class="disc" aria-hidden="true"></div><div class="song"><div class="tag" id="tag"></div><strong id="title"></strong><span id="artist"></span><div class="actions"><a id="youtube" target="_blank" rel="noopener noreferrer">유튜브 열기</a><button id="copy">링크 복사</button></div></div></div></div></section><p class="status">같은 장르를 다시 누르면 새로운 곡을 뽑을 수 있습니다.</p></main><script>
const songs={KPOP:[['한 발짝 두 발짝','오마이걸','https://youtu.be/s7rsXU1xCTQ?si=JtGFtw2eHtcJNVvg'],['After Like','아이브','https://youtu.be/CVxTT38_J4c?si=EFA_7x5UujOVAvi_'],['Shut down','블랙핑크','https://youtu.be/POe9SOEKotk?si=o0xmIbdnthGTOckM']],JPOP:[['레몬','요네즈 켄시','https://youtu.be/SX_ViT4Ra7k?si=QuCoq0yXmmrSzhCJ'],['마루노우치 새디스틱','시이나 링고','https://youtu.be/k7856QJZvT4?si=t_gcSpZ8ZwqskrPH'],['비를 부르는 사나이','아마자라시','https://youtu.be/UhCMFp3rdv0?si=cFRY9B6wQT-asYlf']],INDIE:[['두리번','맥거핀','https://youtu.be/2i6CdoLIS5k?si=2vjz9JPDZlHkgU7s'],['표정이나 가면 따윈','까치산','https://youtu.be/iErTvDpDA5I?si=33UFgNC45_KmaR5v'],['No pain','실리카겔','https://youtu.be/ocfjbyD_37U?si=VkzwCsrrkzfH3lUv']],HIPHOP:[['휘슬','플로라이다','https://youtu.be/cSnkWzZ7ZAA?si=GqWaRGS1JHBhPkEf'],['우리서로사랑하지는말자','기리보이','https://youtu.be/CQ7fz_1eu38?si=EIaIdpfKAgfYKxhG'],['Yarr','김하온','https://youtu.be/7XAQ1njo_lY?si=U4Wv-eFRPHmRQM6x']],ROCK:[["Beggin'",'모네스킨','https://youtu.be/-muAvYTyhVE?si=zyV6tkNqeLNuzE2a'],['피아니시모','체리필터','https://youtu.be/VxnWkErj2TE?si=YLhKh9jfDcMxCXlm'],['라젠카','넥스트','https://youtu.be/BFHNK_Isecg?si=e7inq0f7eCngRivB']]};
const buttons=[...document.querySelectorAll('.genre')],tray=document.getElementById('tray'),hint=document.getElementById('hint'),result=document.getElementById('result');let last={},timer,currentUrl='',audio,master,loopId,soundOn=false,userMuted=false;function music(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.24;master.connect(audio.destination)}audio.resume();if(loopId)return;let beat=0;const notes=[196,246.94,293.66,220,261.63,329.63,174.61,220,261.63,196,246.94,293.66];function tone(freq,start,duration,type,vol){const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(vol,start+.015);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);osc.connect(gain);gain.connect(master);osc.start(start);osc.stop(start+duration+.02)}function tick(){if(!soundOn)return;const t=audio.currentTime+.03;let n=beat%12;tone(notes[n]/2,t,.27,'sine',.36);if(n%3===0){tone(notes[n],t,.6,'triangle',.15);tone(notes[n]*1.26,t,.6,'triangle',.08)}if(n%2===1)tone(1600,t,.035,'triangle',.018);beat++}tick();loopId=setInterval(tick,330)}function stopMusic(){if(loopId){clearInterval(loopId);loopId=null}if(audio)audio.suspend()}document.getElementById('sound').onclick=()=>{soundOn=!soundOn;userMuted=!soundOn;const el=document.getElementById('sound');el.textContent=soundOn?'♪ SOUND ON':'♪ SOUND OFF';el.setAttribute('aria-pressed',String(soundOn));soundOn?music():stopMusic()};buttons.forEach(btn=>btn.addEventListener('click',()=>{if(!soundOn&&!userMuted){soundOn=true;document.getElementById('sound').textContent='♪ SOUND ON';document.getElementById('sound').setAttribute('aria-pressed','true')}if(soundOn)music();const genre=btn.dataset.genre,list=songs[genre];let choices=list.map((_,i)=>i).filter(i=>i!==last[genre]);if(!choices.length)choices=list.map((_,i)=>i);const index=choices[Math.floor(Math.random()*choices.length)];last[genre]=index;clearTimeout(timer);buttons.forEach(b=>b.disabled=true);result.classList.remove('visible');hint.hidden=false;hint.innerHTML='CD를 꺼내는 중...';tray.classList.remove('dispensing');void tray.offsetWidth;timer=setTimeout(()=>{const [title,artist,url]=list[index];currentUrl=url;document.getElementById('tag').textContent=genre+' · YOUR PICK';document.getElementById('title').textContent=title;document.getElementById('artist').textContent=artist;document.getElementById('youtube').href=url;hint.hidden=true;result.classList.add('visible');tray.classList.add('dispensing');buttons.forEach(b=>b.disabled=false)},650)}));document.getElementById('youtube').addEventListener('click',()=>{soundOn=false;document.getElementById('sound').textContent='♪ SOUND OFF';document.getElementById('sound').setAttribute('aria-pressed','false');stopMusic()});document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(currentUrl);const el=document.getElementById('copy');el.textContent='복사 완료';setTimeout(()=>el.textContent='링크 복사',1800)}catch{window.prompt('링크를 복사해 주세요',currentUrl)}};
</script></body></html>
